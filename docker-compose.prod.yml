services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    # Security: Postgres port is internal only and NOT published to the host network in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow} -d ${POSTGRES_DB:-devflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - devflow_postgres_data_prod:/var/lib/postgresql/data
    networks:
      - devflow-net

  server:
    build:
      context: ./server
      target: production
    container_name: devflow-server-prod
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://devflow:devflow@postgres:5432/devflow}
      PORT: ${SERVER_PORT:-5000}
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devflow-net

  client:
    build:
      context: ./client
      target: production
    container_name: devflow-client-prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - devflow-net

volumes:
  devflow_postgres_data_prod:

networks:
  devflow-net:
    driver: bridge
