services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow} -d ${POSTGRES_DB:-devflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - devflow_postgres_data:/var/lib/postgresql/data
    networks:
      - devflow-net

  server:
    build:
      context: ./server
      target: dev
    container_name: devflow-server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://devflow:devflow@postgres:5432/devflow}
      PORT: ${SERVER_PORT:-5000}
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
      - /app/src/generated
    networks:
      - devflow-net

  client:
    build:
      context: ./client
      target: dev
    container_name: devflow-client
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    networks:
      - devflow-net

volumes:
  devflow_postgres_data:

networks:
  devflow-net:
    driver: bridge